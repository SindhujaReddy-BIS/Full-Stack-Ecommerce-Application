spring.application.name=sb-ecom

# PostgreSQL configuration (override through environment variables)
spring.datasource.url=${DB_URL:jdbc:postgresql://localhost:5432/ecommerce}
spring.datasource.username=${DB_USERNAME:postgres}
spring.datasource.password=${DB_PASSWORD}

spring.jpa.hibernate.ddl-auto=update
spring.jpa.database-platform=org.hibernate.dialect.PostgreSQLDialect

project.image=images/

# JWT: provide a long, random secret through JWT_SECRET.
spring.app.jwtSecret=${JWT_SECRET}
spring.app.jwtExpirationMs=${JWT_EXPIRATION_MS:300000000}
spring.ecom.app.jwtCookieName=springBootEcom

frontend.url=${FRONTEND_URL:http://localhost:5173/}
image.base.url=${IMAGE_BASE_URL:http://localhost:8080/images}

# Stripe secret must be provided through STRIPE_SECRET_KEY.
stripe.secret.key=${STRIPE_SECRET_KEY}
